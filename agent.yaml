description: Extracts clinical trial inclusion/exclusion criteria from ClinicalTrials.gov and matches them against electronic health record FHIR symptom and lab profiles.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - clinical-criteria-nlp-matching
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - healthcare
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/clinical-trial-eligibility-matcher"
