spec_version: "0.1.0"
name: "clinical-trial-eligibility-matcher"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Extracts clinical trial inclusion/exclusion criteria from ClinicalTrials.gov and matches them against electronic health record FHIR symptom and lab profiles"
capabilities:
  - "clinical-criteria-nlp-matching"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "clinical-criteria-nlp-matching"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
